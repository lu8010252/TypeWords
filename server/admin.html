<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TypeWords 档案管理</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.6 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; }
  input, button { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid #8886; }
  input { width: 100%; box-sizing: border-box; }
  button { cursor: pointer; background: #2f7df6; color: #fff; border: 0; }
  button.ghost { background: transparent; color: inherit; border: 1px solid #8886; }
  button.danger { background: #d64545; }
  .row { display: flex; gap: 8px; margin: 8px 0; }
  .card { border: 1px solid #8884; border-radius: 12px; padding: 12px; margin: 12px 0; }
  code { word-break: break-all; background: #8882; padding: 2px 6px; border-radius: 6px; }
  .muted { opacity: .7; font-size: 14px; }
  #msg { color: #d64545; min-height: 1.5em; }
</style>
</head>
<body>
<h1>TypeWords 档案管理</h1>
<p class="muted">每个孩子一个档案,各自的学习进度独立同步。设备上填「档案密钥」即可。</p>

<div class="row">
  <input id="token" type="password" placeholder="管理口令(ADMIN_TOKEN)" />
  <button id="login">进入</button>
</div>
<div id="msg"></div>

<div id="panel" hidden>
  <div class="row">
    <input id="newName" placeholder="新孩子的名字,例如:大宝" />
    <button id="add">创建</button>
  </div>
  <div id="list"></div>
</div>

<script>
const $ = id => document.getElementById(id)
let token = sessionStorage.getItem('tw_admin') || ''
if (token) $('token').value = token

async function api(method, url, body) {
  const r = await fetch(url, {
    method,
    headers: { 'Content-Type': 'application/json', 'X-Admin-Token': token },
    body: body ? JSON.stringify(body) : undefined,
  })
  const j = await r.json().catch(() => ({}))
  if (!r.ok) throw new Error(j?.error?.message || r.status)
  return j
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])) }

async function refresh() {
  $('msg').textContent = ''
  try {
    const { profiles } = await api('GET', '/api/admin/profiles')
    sessionStorage.setItem('tw_admin', token)
    $('panel').hidden = false
    $('list').innerHTML = profiles.length ? '' : '<p class="muted">还没有档案,先创建一个。</p>'
    for (const p of profiles) {
      const d = document.createElement('div')
      d.className = 'card'
      d.innerHTML = `<b>${esc(p.name)}</b>
        <div class="muted">档案密钥:</div>
        <div><code>${esc(p.key)}</code></div>
        <div class="muted">服务器地址:<code>${esc(location.origin)}</code></div>
        <div class="row">
          <button class="ghost" data-a="copy">复制密钥</button>
          <button class="ghost" data-a="rotate">换新密钥</button>
          <button class="danger" data-a="del">删除</button>
        </div>`
      d.querySelector('[data-a=copy]').onclick = async () => {
        try { await navigator.clipboard.writeText(p.key); $('msg').style.color = 'inherit'; $('msg').textContent = '已复制' }
        catch { prompt('复制下面的密钥', p.key) }
      }
      d.querySelector('[data-a=rotate]').onclick = async () => {
        if (!confirm('换新密钥后,旧密钥的设备需要重新填写。继续?')) return
        await api('PATCH', '/api/admin/profiles/' + p.id, { rotateKey: true }); refresh()
      }
      d.querySelector('[data-a=del]').onclick = async () => {
        if (!confirm('删除档案「' + p.name + '」?(磁盘上的数据文件会保留,可手动清理)')) return
        await api('DELETE', '/api/admin/profiles/' + p.id); refresh()
      }
      $('list').appendChild(d)
    }
  } catch (e) {
    $('panel').hidden = true
    $('msg').style.color = '#d64545'
    $('msg').textContent = e.message
  }
}

$('login').onclick = () => { token = $('token').value.trim(); refresh() }
$('add').onclick = async () => {
  const name = $('newName').value.trim()
  if (!name) return
  try { await api('POST', '/api/admin/profiles', { name }); $('newName').value = ''; refresh() }
  catch (e) { $('msg').textContent = e.message }
}
if (token) refresh()
</script>
</body>
</html>
